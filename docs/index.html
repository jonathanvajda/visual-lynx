<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>D3 Graph Viewer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- Public CSS -->
    <link rel="stylesheet" href="./styles/skeleton.css" />

    <!-- App Global CSS -->
    <script>
      (function () {
        const APPBASE_CSS_SOURCES = [
          /*"./styles/app-base.css",  local dev copy first */
          "https://jonathanvajda.github.io/OntoEagle/styles/app-base.css",
          "https://jonathanvajda.github.io/table-nova/styles/app-base.css",
        ];

        function loadCss(href) {
          return new Promise((resolve, reject) => {
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = href;

            link.onload = () => resolve(href);
            link.onerror = () => reject(new Error("CSS failed: " + href));

            document.head.appendChild(link);
          });
        }

        function showFailure(msg) {
          console.error(msg);
          // Optional user-visible banner
          const style = document.createElement("style");
          style.textContent =
            ".asset-fail-banner{position:fixed;left:0;right:0;top:0;z-index:9999;" +
            "padding:.5rem .75rem;font:14px system-ui;background:#ffe8e8;color:#400;" +
            "border-bottom:1px solid rgba(0,0,0,.2)}";
          document.head.appendChild(style);

          const div = document.createElement("div");
          div.className = "asset-fail-banner";
          div.textContent = msg;
          document.body ? document.body.prepend(div) : document.addEventListener("DOMContentLoaded", () => document.body.prepend(div));
        }

        (async () => {
          for (const href of APPBASE_CSS_SOURCES) {
            try { await loadCss(href); return; } catch (_) {}
          }
          showFailure("Failed to load app base CSS from all sources.");
        })();
      })();
    </script>
    <script>
      (function () {
        const HEADER_CSS_SOURCES = [
          /*"./styles/site-header.css",  local dev copy first */
          "https://jonathanvajda.github.io/OntoEagle/styles/site-header.css",
          "https://jonathanvajda.github.io/table-nova/styles/site-header.css",
        ];

        function loadCss(href) {
          return new Promise((resolve, reject) => {
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = href;

            link.onload = () => resolve(href);
            link.onerror = () => reject(new Error("CSS failed: " + href));

            document.head.appendChild(link);
          });
        }

        function showFailure(msg) {
          console.error(msg);
          // Optional user-visible banner
          const style = document.createElement("style");
          style.textContent =
            ".asset-fail-banner{position:fixed;left:0;right:0;top:0;z-index:9999;" +
            "padding:.5rem .75rem;font:14px system-ui;background:#ffe8e8;color:#400;" +
            "border-bottom:1px solid rgba(0,0,0,.2)}";
          document.head.appendChild(style);

          const div = document.createElement("div");
          div.className = "asset-fail-banner";
          div.textContent = msg;
          document.body ? document.body.prepend(div) : document.addEventListener("DOMContentLoaded", () => document.body.prepend(div));
        }

        (async () => {
          for (const href of HEADER_CSS_SOURCES) {
            try { await loadCss(href); return; } catch (_) {}
          }
          showFailure("Failed to load header CSS from all sources.");
        })();
      })();
    </script>

    <!-- App Local CSS -->
    <link rel="stylesheet" href="./styles/d3-visualizer.css">
    <link rel="modulepreload" href="./app/shared/namespace-registry/prefix-map.js" />
    <link rel="modulepreload" href="./app/shared/namespace-registry/rdf-prefixes.js" />
    <link rel="modulepreload" href="./app/shared/namespace-registry/rdf-serialization-prefixes.js" />
</head>
 
<body data-page-id="visual-lynx">
  <header id="siteHeader" class="sitehdr-root" role="banner" aria-label="Site header"></header>
  <div class="viz-panel">
  <div class="viz-toolbar">
    <div class="viz-field viz-field--focus">
      <label for="focusNodeInputBox">Focus node</label>
      <input
        id="focusNodeInputBox"
        type="text"
        placeholder="Enter the starting @id (leave blank to show full graph)"
      />
    </div>

    <div class="viz-field viz-field--file">
      <label for="graphFileInput">Graph file</label>
      <input
        id="graphFileInput"
        type="file"
        accept=".ttl,.turtle,.n3,.nt,.ntriples,.nq,.nquads,.trig,.jsonld,.json-ld,.json,.rdf,.owl,.xml,application/ld+json,text/turtle,application/n-triples,application/n-quads,application/trig,application/rdf+xml"
      />
    </div>

    <div class="viz-field viz-field--format">
      <label for="graphInputFormat">Input format</label>
      <select id="graphInputFormat">
        <option value="auto" selected>Auto-detect</option>
        <option value="text/turtle">Turtle</option>
        <option value="application/n-triples">N-Triples</option>
        <option value="application/trig">TriG</option>
        <option value="application/ld+json">JSON-LD</option>
        <option value="application/rdf+xml">RDF/XML</option>
      </select>
    </div>

    <div class="viz-actions" aria-label="Graph actions">
      <button id="loadBfoGraphDataBtn" class="d3_button" type="button">Get BFO Graph</button>
      <button id="renderBtn" class="d3_button" type="button">Render</button>
    </div>
  </div>

  <div class="viz-textarea-wrap">
    <details><summary>JSON-LD data</summary>
    <textarea id="jsonInput" style="width: 95%;"></textarea>
    </details>
  </div>
</div>
  
  <div id="graph-container">
    <svg id="graph"></svg>
    <div id="filterBox">
      <label><input type="checkbox" id="hideBNodes" checked /> Hide _b Nodes</label><br>
      <label><input type="checkbox" id="hideAxioms" checked /> Hide Axioms</label><br>
      <label for="typeFilter">Filter by Type:</label>
      <select id="typeFilter" multiple size="5">
      </select>
      <label for="predicateFilter">Filter by Predicate:</label>
      <select id="predicateFilter" multiple>
      </select>
    </div>

    <div id="propertyBox" class="property-box">
      <h3>Node Properties</h3>
      <div id="propertyContent"></div>
    </div>
  </div>

  <!-- App JS -->
  <script>
    (function () {
      const JS_SOURCES = [
        /* "./app/site-header.js", local dev copy first */
        "https://jonathanvajda.github.io/OntoEagle/app/site-header.js",
        "https://jonathanvajda.github.io/table-nova/app/site-header.js",
      ];

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.defer = true;

          s.onload = () => resolve(src);
          s.onerror = () => reject(new Error("JS failed: " + src));

          document.head.appendChild(s);
        });
      }

      function showFailure(msg) {
        console.error(msg);
        const div = document.createElement("div");
        div.style.cssText =
          "position:fixed;left:0;right:0;bottom:0;z-index:9999;" +
          "padding:.5rem .75rem;font:14px system-ui;background:#ffe8e8;color:#400;" +
          "border-top:1px solid rgba(0,0,0,.2)";
        div.textContent = msg;
        document.body ? document.body.appendChild(div) : document.addEventListener("DOMContentLoaded", () => document.body.appendChild(div));
      }

      (async () => {
        for (const src of JS_SOURCES) {
          try { await loadScript(src); return; } catch (_) {}
        }
        showFailure("Failed to load header JavaScript from all sources.");
      })();
    })();
  </script>
  <!-- Visual Lynx JS -->
  <script src="./app/jsonld-visualizer-core.js"></script>
  <script src="./app/jsonld-visualizer-ui.js"></script>
  <!-- LD Transformer JS -->
  <script src="./app/n3.min.js"></script>
  <script src="./app/jsonld.min.js"></script>
  <script src="./app/rdflib.min.js"></script>
  <script src="./app/shared/format-registry/browser-global.js"></script>
  <script type="module" src="./app/jsonld-visualizer-loader.js"></script>
  <!-- Header JS -->
  <script id="fetch-json-data">
    async function loadJsonDataToTextArea() {
      // Get file that was loaded or the stock example

      // Get file that was loaded
          // Load file
          // Recognize MIME type
          // If it is not JSON-LD, then convert it to JSON-LD. We need the linked data transformer first.
          // If it is JSON-LD, then pass it over to the textarea

      // Get the stock example
      fetch('./data/bfo-json-ld.json')
        .then(response => {
            if (!response.ok) {
                // Throw an error if the response status is not OK (e.g., 404, 500)
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
        })
        .then(content => {
            document.getElementById('jsonInput').value = content;
        })
        .catch(error => {
            console.error('Error fetching the file:', error);
            // Display a more specific error message in the textarea
            document.getElementById('jsonInput').value = `Error loading file from server: ${error.message}`;
        });
    }
  </script>

</body>

</html>
