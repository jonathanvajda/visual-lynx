<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>D3 Graph Viewer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- Public CSS -->
    <link rel="stylesheet" href="./styles/normalize.css" />
    <link rel="stylesheet" href="./styles/skeleton.css" />

    <!-- App Global CSS -->
    <script>
      (function () {
        const APPBASE_CSS_SOURCES = [
          /*"./styles/app-base.css",  local dev copy first */
          "https://jonathanvajda.github.io/OntoEagle/styles/app-base.css",
          "https://jonathanvajda.github.io/table-nova/styles/app-base.css",
        ];

        function loadCss(href) {
          return new Promise((resolve, reject) => {
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = href;

            link.onload = () => resolve(href);
            link.onerror = () => reject(new Error("CSS failed: " + href));

            document.head.appendChild(link);
          });
        }

        function showFailure(msg) {
          console.error(msg);
          // Optional user-visible banner
          const style = document.createElement("style");
          style.textContent =
            ".asset-fail-banner{position:fixed;left:0;right:0;top:0;z-index:9999;" +
            "padding:.5rem .75rem;font:14px system-ui;background:#ffe8e8;color:#400;" +
            "border-bottom:1px solid rgba(0,0,0,.2)}";
          document.head.appendChild(style);

          const div = document.createElement("div");
          div.className = "asset-fail-banner";
          div.textContent = msg;
          document.body ? document.body.prepend(div) : document.addEventListener("DOMContentLoaded", () => document.body.prepend(div));
        }

        (async () => {
          for (const href of APPBASE_CSS_SOURCES) {
            try { await loadCss(href); return; } catch (_) {}
          }
          showFailure("Failed to load app base CSS from all sources.");
        })();
      })();
    </script>
    <script>

        function showFailure(msg) {

          div.textContent = msg;

          for (const href of HEADER_CSS_SOURCES) {

    <!-- App Local CSS -->

<body data-page-id="visual-lynx">
  <header id="siteHeader" class="sitehdr-root" role="banner" aria-label="Site header"></header>
  <div>
    <span style="margin-left: 2rem;">Focus node:</span></strong><input id="focusNodeInputBox" type="text" style="width: 30%; margin-bottom: 0.5rem;" placeholder="Enter the starting @id (leave blank to show full graph)">
      <!-- This requires a way to handle RDF and transform it, adding it to textbox -->
      <button id="loadUserGraphDataBtn" class="d3_button">Upload Graph Data</button>    
      <button id="loadBfoGraphDataBtn" class="d3_button" onclick="loadJsonDataToTextArea()">Get BFO Graph</button>
      <button id="renderBtn" class="d3_button"  onclick="renderGraphFromTextarea()">Render</button><br />
    <textarea id="jsonInput"></textarea>
  </div>
  
  <div id="graph-container">
    <svg id="graph"></svg>
    <div id="filterBox">
      <label><input type="checkbox" id="hideBNodes" checked /> Hide _b Nodes</label><br>
      <label><input type="checkbox" id="hideAxioms" checked /> Hide Axioms</label><br>
      <label for="typeFilter">Filter by Type:</label>
      <select id="typeFilter" multiple size="5">
      </select>
      <label for="predicateFilter">Filter by Predicate:</label>
      <select id="predicateFilter" multiple>
      </select>
    </div>

    <div id="propertyBox" class="property-box">
      <h3>Node Properties</h3>
      <div id="propertyContent"></div>
    </div>
  </div>

  <!-- App JS -->
  <script>
    (function () {
      const JS_SOURCES = [
        /* "./app/site-header.js", local dev copy first */
        "https://jonathanvajda.github.io/OntoEagle/app/site-header.js",
        "https://jonathanvajda.github.io/table-nova/app/site-header.js",
      ];

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.defer = true;

          s.onload = () => resolve(src);
          s.onerror = () => reject(new Error("JS failed: " + src));

          document.head.appendChild(s);
        });
      }

      function showFailure(msg) {
        console.error(msg);
        const div = document.createElement("div");
        div.style.cssText =
          "position:fixed;left:0;right:0;bottom:0;z-index:9999;" +
          "padding:.5rem .75rem;font:14px system-ui;background:#ffe8e8;color:#400;" +
          "border-top:1px solid rgba(0,0,0,.2)";
        div.textContent = msg;
        document.body ? document.body.appendChild(div) : document.addEventListener("DOMContentLoaded", () => document.body.appendChild(div));
      }

      (async () => {
        for (const src of JS_SOURCES) {
          try { await loadScript(src); return; } catch (_) {}
        }
        showFailure("Failed to load header JavaScript from all sources.");
      })();
    })();
  </script>
  <script src="./app/jsonld-visualizer-core.js"></script>
  <script src="./app/jsonld-visualizer-ui.js"></script>
  <script id="fetch-json-data">
    async function loadJsonDataToTextArea() {
      // Get file that was loaded or the stock example

      // Get file that was loaded
          // Load file
          // Recognize MIME type
          // If it is not JSON-LD, then convert it to JSON-LD. We need the linked data transformer first.
          // If it is JSON-LD, then pass it over to the textarea

      // Get the stock example
      fetch('./data/bfo-json-ld.json')
        .then(response => {
            if (!response.ok) {
                // Throw an error if the response status is not OK (e.g., 404, 500)
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
        })
        .then(content => {
            document.getElementById('jsonInput').value = content;
        })
        .catch(error => {
            console.error('Error fetching the file:', error);
            // Display a more specific error message in the textarea
            document.getElementById('jsonInput').value = `Error loading file from server: ${error.message}`;
        });
    }
  </script>

</body>

</html>
